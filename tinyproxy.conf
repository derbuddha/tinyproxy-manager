User tinyproxy
Group tinyproxy
Port 8888
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/var/run/tinyproxy/tinyproxy.pid"
MaxClients 100
MinSpareServers 5
MaxSpareServers 20
StartServers 10
MaxRequestsPerChild 0

# Erlaube Zugriff von allen (anpassen nach Bedarf)
# Für Production: Nur bestimmte Netzwerke erlauben
Allow 0.0.0.0/0

# ViaProxyName "tinyproxy"

# Domain-Blocking via Filter
Filter "/etc/tinyproxy/blocked-domains.txt"
FilterURLs On
FilterExtended On

# Upstream Proxy Configuration (optional)
# Managed by the Tinyproxy GUI
# Upstream http proxy.example.com:3128 "."
# No proxy example: No localhost
# No 192.168.0.0/16
