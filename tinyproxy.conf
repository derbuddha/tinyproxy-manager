User tinyproxy
Group tinyproxy
Port 8888
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/var/run/tinyproxy/tinyproxy.pid"
MaxClients 100
MinSpareServers 5
MaxSpareServers 20
StartServers 10
MaxRequestsPerChild 0

# Container access control - auto-generated by the Tinyproxy GUI, do not edit
# by hand (overwritten on every sync). Manage via the GUI's "Container Access"
# section, or the allowed-containers.txt / blocked-containers.txt files
# (containers are matched by Docker container *name*, not IP - the GUI
# resolves each name to its current IP on the codersrv_default network at
# sync time, since bridge-network IPs can change across container restarts).
#
# Policy is set by proxy-config.json's new_client_policy:
#   "block" (default-deny) -> only names in allowed-containers.txt get "Allow <ip>"
#   "allow" (default-allow, current) -> everyone gets Allow 0.0.0.0/0 below,
#     except names in blocked-containers.txt, which get an explicit "Deny <ip>"
# CONTAINER_ALLOW_START
Allow 127.0.0.1
# CONTAINER_ALLOW_END

# ViaProxyName "tinyproxy"

# Domain Filtering (Block or Allow list) - managed by the Tinyproxy GUI
# DOMAIN_FILTER_START
Filter "/etc/tinyproxy/allowed-domains.txt"
FilterDefaultDeny Yes
# DOMAIN_FILTER_END
# Filter based on domains (default), not URLs
FilterURLs Off

# Case-insensitive filtering
FilterCaseSensitive Off

FilterExtended On

# Upstream Proxy Configuration (optional)
# Do not edit between the UPSTREAM markers by hand - the GUI overwrites them
# whenever the upstream proxy or its domain list is saved.
# Upstream routing is opt-in: only hosts matching an explicit
#   upstream <host>:<port> "<domain>"
# rule are forwarded to the upstream proxy - everything else, including every
# allowed domain, connects directly. No catch-all "Upstream <host>:<port>" line
# is written any more.
# Example - route test.de (and its subdomains) through the upstream proxy at
# 192.168.1.10:3128, everything else keeps going direct:
#   upstream 192.168.1.10:3128 "test.de"
# While the upstream proxy is disabled, its host/port and the domain list are
# parked as SAVED comment lines so they survive a disable/enable round-trip.
# Managed by the Tinyproxy GUI
# UPSTREAM_START
# UPSTREAM_PROXY proxy.example.com:3128
# Only these domains are routed through the upstream proxy
upstream proxy.example.com:3128 "test.de"
# UPSTREAM_END

# Hand-maintained upstream rules, hidden from the GUI.
# Everything between the UPSTREAM_HIDDEN markers is ignored by the GUI: it is
# never parsed, never listed in the "Upstream Proxy" section and never
# rewritten when the upstream proxy or its domain list is saved. Tinyproxy
# itself reads these lines exactly like the managed ones, so this is the place
# for a second (or third) upstream proxy with its own domains.
# Same syntax as above - one rule per line:
#   upstream <host>:<port> "<domain>"
# Keep the domains disjoint from the GUI-managed list; overlapping patterns
# make it ambiguous which proxy wins.
# Restart Tinyproxy after editing by hand - the GUI's restart button works too.
# UPSTREAM_HIDDEN_START
# upstream proxy2.example.com:3128 "test2.de"
# UPSTREAM_HIDDEN_END
